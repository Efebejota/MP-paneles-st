  // Amine, 15 sep 2026: "Tiempo medio respuestas clientes tipo 1 y tipo 2" no puede ser manual — ya
  // tenemos el dato en el dashboard de Zendesk (zendesk-tecnicos-production), que sí trae tipo1cnt/
  // tipo2cnt y avgFR1/avgFR2 por técnico. La media debe ser PROPORCIONAL al nº de tickets de cada
  // tipo (solo coincide con la media aritmética simple cuando hay 50%/50% de tipo 1 y tipo 2).
  'tiempo_medio_respuestas_clientes_tipo_1_': m => {

    if (n1 + n2 <= 0 || m.avgFR1 == null || m.avgFR2 == null) return null;

  },
};

// Carga automática desde la automatización n8n (Automatizaciones_n8n/Objetivos_Empresa_Automatizacion):
// cada respuesta de formulario queda guardada en GET /api/company-data, servido por el mismo backend
// que sirve este HTML (mismo origen, por eso la ruta es relativa). Si la API no responde (redeploy en
// marcha, o un indicador que todavía no tiene ningún dato), el panel sigue funcionando con lo que ya
// hubiera en EMPRESA_DATOS (edición manual de esta sesión, o "—").
const MESES_ES_L = ["enero","febrero","marzo","abril","mayo","junio","julio","agosto","septiembre","octubre","noviembre","diciembre"];
const MESES_EN_L = ["January","February","March","April","May","June","July","August","September","October","November","December"];
function formatMesYYYYMM(yyyymm) {
  if (!yyyymm || !/^\d{4}-\d{2}$/.test(yyyymm)) return null;
  const [y, m] = yyyymm.split('-').map(Number);
  const nombres = LANG === 'en' ? MESES_EN_L : MESES_ES_L;
  return `${nombres[m - 1]} ${y}`;
}
async function cargarEmpresaDatos() {
  try {
    const res = await fetch('/api/company-data', { cache: 'no-store' });
    if (!res.ok) return;
    const data = await res.json();
    EMPRESA_INDICADORES.forEach(({ id }) => {
      const ind = data[id];
      if (!ind || !ind.ultimoMes || !ind.historico || !ind.historico[ind.ultimoMes]) return;
      const dato = ind.historico[ind.ultimoMes];
      EMPRESA_DATOS[id] = {
        mesLabel: (EMPRESA_DATOS[id] && EMPRESA_DATOS[id].mesLabel) || null,
        mesYYYYMM: ind.ultimoMes,
        mesCerrado: dato.valorMes,
        acumuladoSemestre: dato.acumulado,
      };
    });
    render();
  } catch (e) {
    // Sin conexión con la API de datos de empresa: se deja lo que ya hubiera.
  }
}

let lastStatus = { type: 'loading', key: 'initializing', args: [] };
function setStatus(type, key, ...args) {
  lastStatus = { type, key, args };
  const s = I18N[LANG].status;
  const val = s[key];
  const msg = typeof val === 'function' ? val(...args) : val;
  document.getElementById('dotStatus').className = 'status-dot ' + type;
  document.getElementById('txtStatus').textContent = msg;
}

function applyStaticI18N(){
  const s = I18N[LANG];
  document.getElementById('i18n-title').textContent = s.title;
  document.getElementById('i18n-subtitle').textContent = s.subtitle;
  document.getElementById('i18n-refresh-btn').textContent = s.refreshBtn;
  document.getElementById('i18n-empresa-btn').textContent = s.empresaNavBtn;
  const loadingEl = document.getElementById('i18n-loading');
  if (loadingEl) loadingEl.textContent = s.loading; // el div "app" se reemplaza por completo en el primer render()
  document.getElementById('i18n-period-note').innerHTML = s.periodNote;
  document.getElementById('i18n-footer').innerHTML = s.footer;
  document.querySelectorAll('#periodTabs .tab-btn').forEach(btn=>{
    btn.textContent = s.tabs[btn.dataset.period] || btn.dataset.period;
  });
  document.getElementById('lang-es-btn').classList.toggle('active', LANG==='es');
  document.getElementById('lang-en-btn').classList.toggle('active', LANG==='en');
  setStatus(lastStatus.type, lastStatus.key, ...lastStatus.args);
}

function setLang(lang){
  LANG = lang;
  applyStaticI18N();
  render();
}

// El semestre de objetivos empieza el 1 de julio de 2026: no se cuentan datos anteriores.
const SEMESTRE_INICIO = new Date(2026, 6, 1); // mes 6 = julio (0-indexado)

function mesesTranscurridosSemestre() {
  const now = new Date();
  let m = (now.getFullYear() - SEMESTRE_INICIO.getFullYear()) * 12 + (now.getMonth() - SEMESTRE_INICIO.getMonth()) + 1;
  return Math.max(1, Math.min(6, m));
}

// Nº de meses NATURALES ya cerrados por completo desde el inicio del semestre (julio no cuenta
// hasta que termine, agosto no cuenta hasta que termine, etc.). Se usa como base del "ritmo": si
// hoy es 9 de agosto, solo julio está cerrado → 1 mes, aunque el acumulado ya incluya también los
// puntos de agosto en curso. Mínimo 1 para no dividir por cero. Distinto de
// mesesTranscurridosSemestre() (que cuenta también el mes en curso y se usa para decidir hasta
// cuándo es fiable la aproximación de /api/stats sin el endpoint de rango).
function mesesCompletosCerrados() {
  const now = new Date();
  const m = (now.getFullYear() - SEMESTRE_INICIO.getFullYear()) * 12 + (now.getMonth() - SEMESTRE_INICIO.getMonth());
  return Math.max(1, Math.min(6, m));
}

// Puntos acumulados desde el 1 de julio.
//
// Preferido: /api/stats/range?from=2026-07-01 — un endpoint de rango exacto en el backend de
// Railway, que suma directamente sobre los tickets cacheados sin depender de los períodos fijos.
// Se intenta cargar en cada refresco (ver cargarDatos); si el backend aún no lo tiene desplegado,
// la llamada devuelve 404 y "rangeData" queda a null, y este panel usa automáticamente el método
// de reserva de abajo — en cuanto se despliegue el endpoint, el panel se pone exacto solo, sin tocar
// este archivo de nuevo.
//
// Reserva (mientras no exista el endpoint): sumar "mes actual" + "último mes cerrado" — solo es
// EXACTO en julio y agosto (los 2 primeros meses del semestre); a partir de septiembre faltarían
// meses intermedios y daría un total incorrecto (más bajo del real), así que a partir de ahí se
// marca como "no disponible" en vez de mostrar un número equivocado.
function puntosAcumulados(zName) {
  const meses = mesesTranscurridosSemestre();
  if (!zName) return { valor: null, completo: false, meses, requiereBackend: false };

  if (rangeData && rangeData.byAgent && rangeData.byAgent[zName] && rangeData.byAgent[zName].puntos != null) {
    return { valor: rangeData.byAgent[zName].puntos, completo: true, meses, requiereBackend: false, exacto: true };
  }

  if (!statsData) return { valor: null, completo: false, meses, requiereBackend: false };
  if (meses > 2) {
    return { valor: null, completo: false, meses, requiereBackend: true };
  }
  const mesActual = statsData['current_month'] && statsData['current_month'].byAgent && statsData['current_month'].byAgent[zName];
  const mesCerrado = statsData['last_month'] && statsData['last_month'].byAgent && statsData['last_month'].byAgent[zName];
  let valor = 0, tieneDatos = false;
  if (mesActual && mesActual.puntos != null) { valor += mesActual.puntos; tieneDatos = true; }
  if (meses >= 2 && mesCerrado && mesCerrado.puntos != null) { valor += mesCerrado.puntos; tieneDatos = true; }
  if (!tieneDatos) return { valor: null, completo: false, meses, requiereBackend: false };
  return { valor, completo: true, meses, requiereBackend: false, exacto: false };
}

// Pinta el % al final de cada barra del gráfico de RESUMEN, siempre visible (sin depender del hover
// del tooltip) — a petición de Fernando, 15 sep 2026. Plugin propio en vez de una librería aparte
// (chartjs-plugin-datalabels) para no añadir una dependencia más solo para esto.
const BAR_VALUE_LABELS_PLUGIN = {
  id: 'barValueLabels',
  afterDatasetsDraw(chart) {
    const { ctx } = chart;
    chart.data.datasets.forEach((dataset, dsIndex) => {
      const meta = chart.getDatasetMeta(dsIndex);
      if (!meta || meta.hidden) return;
      meta.data.forEach((bar, i) => {
        const value = dataset.data[i];
        if (value === null || value === undefined) return;
        ctx.save();
        ctx.font = '600 11px -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif';
        ctx.fillStyle = '#1c2128';
        ctx.textAlign = 'left';
        ctx.textBaseline = 'middle';
        ctx.fillText(`${value}%`, bar.x + 6, bar.y);
        ctx.restore();
      });
    });
  },
};

async function cargarDatos(force) {
  setStatus('loading', 'connecting');
  try {
    const desde = SEMESTRE_INICIO.toISOString().slice(0, 10);
    const [rT, rS, rR] = await Promise.all([
      fetch(`${API}/api/tecnicos?_=${force ? Date.now() : ''}`, { cache: 'no-store' }),
      fetch(`${API}/api/stats?_=${force ? Date.now() : ''}`, { cache: 'no-store' }),
      fetch(`${API}/api/stats/range?from=${desde}&_=${force ? Date.now() : ''}`, { cache: 'no-store' }).catch(() => null),
    ]);
    if (rS.status === 202) {
      setStatus('loading', 'reloading');
      setTimeout(() => cargarDatos(false), 15000);
      return;
    }
    if (!rT.ok || !rS.ok) throw new Error(`HTTP ${rT.status}/${rS.status}`);
    tecnicosApi = (await rT.json()).tecnicos || [];
    statsData = await rS.json();
    rangeData = (rR && rR.ok) ? await rR.json() : null; // 404/error = el backend aún no tiene este endpoint
    setStatus('ok', 'loaded', new Date().toLocaleTimeString('es-ES'), !!rangeData);
    render();
  } catch (e) {
    setStatus('error', 'error', e.message);
    statsData = statsData || {};
    render();
  }
}

// Los objetivos son siempre semestrales (1 ene-30 jun / 1 jul-31 dic). Fernando (8 sep 2026): los
// parciales (semana pasada, mes actual, último mes cerrado, acumulado año) SIEMPRE deben ceñirse a
// esos límites, nunca mostrar datos de antes del inicio del semestre en curso.
//
// Para "year" esto significa que ya no es el año natural completo (que el backend sí calcula desde
// el 1 de enero): se sustituye por el mismo endpoint exacto de rango que ya se usaba para Puntos
// (rangeData, pedido siempre desde SEMESTRE_INICIO — ver cargarDatos), así "Acumulado año" pasa a
// significar en realidad "acumulado desde el inicio de este semestre", igual que Puntos.
//
// Para last_week/current_month/last_month, el backend no expone las fechas exactas de esos buckets,
// así que se recalculan aquí con la misma lógica de calendario que se asume usa el backend, solo para
// detectar el caso límite (primeros días de julio o enero) en que "el mes pasado" o "la semana pasada"
// caerían todavía en el semestre anterior — en ese caso se trata como sin dato, en vez de mostrar
// números que no pertenecen al semestre en curso.
function periodoDentroDeSemestre(period) {
  const now = new Date();
  let inicio;
  if (period === 'last_week') { inicio = new Date(now); inicio.setDate(inicio.getDate() - 6); }
  else if (period === 'current_month') { inicio = new Date(now.getFullYear(), now.getMonth(), 1); }
  else if (period === 'last_month') { inicio = new Date(now.getFullYear(), now.getMonth() - 1, 1); }
  else return true;
  return inicio >= SEMESTRE_INICIO;
}

function getAgentStats(nombreExcel) {
  const zName = ZENDESK_MAP[nombreExcel];
  if (!zName) return { status: 'pending' }; // pendiente de alta en Zendesk
  if (currentPeriod === 'year') {
    if (!rangeData || !rangeData.byAgent || !rangeData.byAgent[zName]) return { status: 'no-data' };
    return { status: 'live', m: rangeData.byAgent[zName] };
  }
  if (!periodoDentroDeSemestre(currentPeriod)) return { status: 'no-data' };
  const periodData = statsData && statsData[currentPeriod];
  if (!periodData || !periodData.byAgent || !periodData.byAgent[zName]) return { status: 'no-data' };
  return { status: 'live', m: periodData.byAgent[zName] };
}

// Indicadores donde "menos es mejor" (tiempos de respuesta, accidentalidad): se invierte la fórmula
// (Target ÷ Resultado) para que mejorar el indicador dé más % de consecución, no menos.
const INVERSE_IDS = new Set([
  'indice_de_frecuencia_accidentes_prl',
  'tiempo_medio_de_respuesta_a_clientes_tip',
  'tiempo_medio_respuestas_clientes_tipo_1_',
  'tratamiento_y_servicio_clientes_tipo_3',
]);

// Indicadores de empresa cuyo Resultado es un importe ACUMULADO mes a mes (EBITDA, Facturación
// Servicenter) — a diferencia del Índice de frecuencia PRL, que es una tasa y no un acumulado
// (por eso está en INVERSE_IDS con la fórmula normal, sin prorratear). Antes de que termine el
// semestre, el acumulado no se puede comparar contra el target de los 6 meses completos: hay que
// prorratear el target a los meses YA CERRADOS. Fernando, 13 sep 2026: ejemplo EBITDA target
// 2.782 / 6 meses = 463,67€/mes; con julio y agosto cerrados (2 meses), la referencia debe ser
// 463,67 × 2 = 927, no 2.782 — si no, el % de consecución sale artificialmente bajo hasta diciembre
// aunque el ritmo real sea correcto.
const PRORRATEO_MENSUAL_IDS = new Set([
  'ebitda_sim_2026_k',
  'facturacion_servicenter_2026_m',
]);

// Indicadores INDIVIDUALES (a diferencia de los de empresa, que son comunes a todo el equipo y se
// editan desde la pestaña "🏢 Datos de empresa") sin fuente en vivo, editables a mano directamente
// desde la ficha del técnico afectado. Fernando, 15 sep 2026: Mar necesita meter a mano "Tratamiento
// y servicio clientes Tipo 3" — el mismo mecanismo sirve para cualquier otro indicador individual
// manual que se añada más adelante (basta con añadir su id aquí).
const MANUAL_TECNICO_EDITABLE_IDS = new Set([
  'tratamiento_y_servicio_clientes_tipo_3',
]);
// { [nombreExcel]: { [indId]: valor } } — igual que EMPRESA_DATOS, pero por técnico. Se guarda en el
// backend (Fernando, 15 sep 2026: "hazlo persistente ahora") vía GET/POST /api/individual-data, con el
// mismo patrón que /api/company-data (lectura pública, escritura protegida con x-api-key).
let MANUAL_TECNICO_DATOS = {};
let editandoManualTecnico = null; // { nombreExcel, indId } mientras se edita una fila desde la ficha
// Clave de acceso compartida para CUALQUIER guardado manual desde el navegador (datos individuales de
// técnico Y "🏢 Datos de empresa", ver guardarManualTecnico() y guardarEmpresaDatos") — es la misma
// x-api-key/API_KEY que ya usaba n8n, así que sirve para ambas rutas. No se embebe en el HTML (el repo
// es público): se pide una vez por sesión de navegador con window.prompt() la primera vez que alguien
// guarda un dato, y se reutiliza mientras la página siga abierta. Si el servidor la rechaza (401) se
// descarta para que se vuelva a pedir en el siguiente intento.
let manualWriteApiKey = null;

// Carga automática de los datos manuales por técnico ya guardados en el backend (mismo origen que
// /api/company-data). Si la API no responde, el panel sigue funcionando con lo que ya hubiera en
// MANUAL_TECNICO_DATOS (p.ej. una edición de esta misma sesión).
async function cargarIndividualDatos() {
  try {
    const res = await fetch('/api/individual-data', { cache: 'no-store' });
    if (!res.ok) return;
    const data = await res.json();
    Object.keys(data).forEach(nombreExcel => {
      MANUAL_TECNICO_DATOS[nombreExcel] = MANUAL_TECNICO_DATOS[nombreExcel] || {};
      Object.keys(data[nombreExcel]).forEach(indId => {
        const dato = data[nombreExcel][indId];
        if (dato && dato.valor !== null && dato.valor !== undefined) {
          MANUAL_TECNICO_DATOS[nombreExcel][indId] = dato.valor;
        }
      });
    });
    render();
  } catch (e) {
    // Sin conexión con la API de datos individuales: se deja lo que ya hubiera.
  }
}

// % de consecución — escala por tramos sobre Min/Target/Máx (Fernando, 15 sep 2026, aplica a TODOS
// los objetivos, de área y personales):
//   resultado < min           → 0%
//   resultado = min           → 80%
//   min < resultado < target  → interpola 80%→100%
//   resultado = target        → 100%
//   target < resultado < max  → interpola 100%→120%
//   resultado >= max          → 120% (tope)
// Cuando "menos es mejor" (INVERSE_IDS) es exactamente al revés: max hace de "mínimo" (80%) y min
// hace de "máximo" (120%), porque un resultado más bajo es mejor.
// overrides {target,min,max}: valores ya prorrateados a usar en vez de los de ind (ver
// PRORRATEO_MENSUAL_IDS) — no cambia lo que se muestra en las columnas Min/Target/Máx, que siguen
// mostrando el objetivo semestral completo.
function calcIndicador(ind, resultado, overrides) {
  if (resultado === null || resultado === undefined) return { resultado: null, pctCons: null, contrib: null };
  overrides = overrides || {};
  const target = overrides.target != null ? overrides.target : ind.target;
  const min = overrides.min != null ? overrides.min : ind.min;
  const max = overrides.max != null ? overrides.max : ind.max;
  const inverse = INVERSE_IDS.has(ind.id);
  let pctCons;
  if (!inverse) {
    if (resultado < min) pctCons = 0;
    else if (resultado <= target) pctCons = (target === min) ? 1.0 : 0.8 + (resultado - min) / (target - min) * 0.2;
    else if (resultado < max) pctCons = (max === target) ? 1.2 : 1.0 + (resultado - target) / (max - target) * 0.2;
    else pctCons = 1.2;
  } else {
    if (resultado > max) pctCons = 0;
    else if (resultado >= target) pctCons = (max === target) ? 1.0 : 1.0 - (resultado - target) / (max - target) * 0.2;
    else if (resultado > min) pctCons = (target === min) ? 1.2 : 1.0 + (target - resultado) / (target - min) * 0.2;
    else pctCons = 1.2;
  }
  const scope = ind.area === 'empresa' ? 0.2 : 0.8;
  const contrib = pctCons * ind.peso * scope;
  return { resultado, pctCons, contrib };
}

// Umbral mínimo (regla del 10%): si el acumulado de puntos no llega al 10% del target semestral
// de puntos, el resto de objetivos individuales (2º, 3º, 4º...) puntúan 0 ese período.
const UMBRAL_PUNTOS_MINIMO = 0.10;

function evaluarTecnico(nombreExcel) {
  const cfg = CONFIG.tecnicos[nombreExcel];
  const agentInfo = getAgentStats(nombreExcel);
  const pending = agentInfo.status === 'pending';
  const zName = ZENDESK_MAP[nombreExcel];

  const idxPuntos = cfg.indicadores.findIndex(i => i.area === 'individual' && i.id.startsWith('no_de_puntos'));
  const puntosAcum = (!pending && zName) ? puntosAcumulados(zName) : { valor: null, completo: false, meses: mesesTranscurridosSemestre() };
  let puntosGateOk = true; // por defecto no se gatea si no hay dato de puntos (evita falsos negativos por caída de la API)

  const filas = cfg.indicadores.map((ind, idx) => {
    if (idx === idxPuntos) {
      const resultado = puntosAcum.valor;
      let pctCons = null, pctRitmo = null, contrib = null;
      if (resultado !== null) {
        // % Consec. de Puntos usa la misma escala por tramos Min/Target/Máx que el resto de
        // objetivos (Fernando, 15 sep 2026: "esto aplica para todos los objetivos, de área y
        // personales") — ver calcIndicador.
        const calcPuntos = calcIndicador(ind, resultado);
        pctCons = calcPuntos.pctCons;
        contrib = calcPuntos.contrib;
        // Ritmo: se divide por los meses YA CERRADOS (no por los "transcurridos" incluyendo el
        // mes en curso), porque el acumulado ya recoge también lo hecho en el mes en curso —
        // dividir por un mes de más infla el denominador y hunde la proyección artificialmente.
        // Esta proyección es solo informativa (no entra en el total) y mantiene su propia escala
        // simple resultado÷target, no la de tramos 80-120%.
        const proyeccion = (resultado / mesesCompletosCerrados()) * 6;
        pctRitmo = proyeccion / ind.target;
        puntosGateOk = resultado >= ind.target * UMBRAL_PUNTOS_MINIMO;
      }
      return { ...ind, resultado, pctCons, pctRitmo, contrib, manual: false, pending, esPuntos: true, gated: false, acum: puntosAcum };
    }
    let resultado = null, manual = true;
    if (agentInfo.status === 'live' && LIVE_FIELD_MAP[ind.id]) {
      resultado = LIVE_FIELD_MAP[ind.id](agentInfo.m);
      manual = false;
    } else if ((ind.id === 'global_scoring_st_slas_pr_1_pr_2_2026_50') || (ind.id === 'de_clientes_tipo_1_y_tipo_2_mantenido_de' && ind.area === 'empresa')) {
      // Global scoring de empresa: se deriva del SLA agregado de todo el equipo (bloque "general" del
      // período). Igual que en getAgentStats(), "year" usa el rango exacto desde el inicio del
      // semestre en vez del año natural, y last_week/current_month/last_month se descartan si caen
      // fuera del semestre en curso (ver periodoDentroDeSemestre).
      const g = currentPeriod === 'year'
        ? (rangeData && rangeData.general)
        : (periodoDentroDeSemestre(currentPeriod) ? (statsData && statsData[currentPeriod] && statsData[currentPeriod].general) : null);
      if (g && g.sla1 != null && g.sla2 != null) { resultado = Math.round((g.sla1 + g.sla2) / 2); manual = false; }
    } else if (ind.id === 'calidad_de_los_tickets_cerrados' && CALIDAD_TICKETS_RESULTADOS.valores[nombreExcel] != null) {
      // Viene de la auditoría mensual del artefacto "calidad-tickets-mp" (rúbrica sobre tickets reales
      // + revisión de Fernando) — se etiqueta como "en vivo" (Fernando, 10 ago 2026), no como "manual".
      resultado = CALIDAD_TICKETS_RESULTADOS.valores[nombreExcel];
      manual = false;
    } else if (EMPRESA_DATOS[ind.id] && EMPRESA_DATOS[ind.id].acumuladoSemestre != null) {
      // Introducido a mano en la pestaña "🏢 Datos de empresa" (o, en el futuro, vía la automatización
      // n8n) — se etiqueta como "en vivo" en cuanto tiene dato, igual que Calidad de tickets.
      resultado = EMPRESA_DATOS[ind.id].acumuladoSemestre;
      manual = false;
    } else if (MANUAL_TECNICO_EDITABLE_IDS.has(ind.id) && MANUAL_TECNICO_DATOS[nombreExcel] && MANUAL_TECNICO_DATOS[nombreExcel][ind.id] != null) {
      // Indicador individual sin fuente en vivo, introducido a mano desde la ficha del técnico (ver
      // MANUAL_TECNICO_EDITABLE_IDS) — mismo criterio que Datos de empresa: en vivo en cuanto hay dato.
      resultado = MANUAL_TECNICO_DATOS[nombreExcel][ind.id];
      manual = false;
    }
    const esProrateado = PRORRATEO_MENSUAL_IDS.has(ind.id);
    const mesesCerrados = mesesCompletosCerrados();
    // Al prorratear el target a los meses cerrados, min y máx se prorratean igual — si no, la escala
    // 80%-100%-120% dejaría de tener sentido a mitad de semestre (ver calcIndicador).
    const targetProrateado = esProrateado ? (ind.target / 6) * mesesCerrados : null;
    const minProrateado = esProrateado ? (ind.min / 6) * mesesCerrados : null;
    const maxProrateado = esProrateado ? (ind.max / 6) * mesesCerrados : null;
    const calc = calcIndicador(ind, resultado, esProrateado ? { target: targetProrateado, min: minProrateado, max: maxProrateado } : null);
    const aplicaGate = ind.area === 'individual'; // la regla del 10% solo afecta a los objetivos individuales 2º+
    const gated = aplicaGate && !puntosGateOk && resultado !== null;
    const finalCalc = gated ? { resultado, pctCons: 0, contrib: 0 } : calc;
    return { ...ind, ...finalCalc, manual, pending, esPuntos: false, gated, esProrateado, targetProrateado, mesesCerrados };
  });

  // Resumen: solo cuentan los indicadores con un valor real de Resultado (regla explícita de Fernando).
  const conDato = filas.filter(f => f.resultado !== null).length;
  const pesoSum = filas.reduce((s, f) => s + (f.resultado !== null ? f.peso * (f.area === 'empresa' ? 0.2 : 0.8) : 0), 0);
  const contribSum = filas.reduce((s, f) => s + (f.contrib || 0), 0);
  const totalPct = pesoSum > 0 ? (contribSum / pesoSum) : null;

  return { nombreExcel, filas, totalPct, conDato, total: filas.length, pending, puntosGateOk };
}

function pillTotal(ev) {
  const s = I18N[LANG];
  if (ev.pending) return `<span class="pill pill-pending">${s.badgePendingAlta}</span>`;
  if (ev.totalPct === null) return `<span class="pill pill-pending">${s.pillSinDatos}</span>`;
  const label = `${Math.round(ev.totalPct * 100)}%`;
  const cls = ev.totalPct >= 1 ? 'pill-good' : ev.totalPct >= 0.8 ? 'pill-warn' : 'pill-bad';
  const icon = ev.totalPct >= 1 ? '✓' : ev.totalPct >= 0.8 ? '●' : '✕';
  const gateWarn = !ev.puntosGateOk ? ` <span title="${s.gateWarnTitle}" style="color:var(--critical)">⚠</span>` : '';
  return `<span class="pill ${cls}">${icon} ${label}</span>${gateWarn} <span style="font-size:10px;color:var(--text-muted)">${s.indicConDato(ev.conDato, ev.total)}</span>`;
}

function renderResumen() {
  const s = I18N[LANG];
  const nombres = Object.keys(CONFIG.tecnicos);
  const evals = nombres.map(evaluarTecnico);
  evals.sort((a, b) => {
    if (a.pending !== b.pending) return a.pending ? 1 : -1;
    const pa = a.totalPct === null ? -1 : a.totalPct, pb = b.totalPct === null ? -1 : b.totalPct;
    return pb - pa;
  });

  const rows = evals.map(ev => {
    const badge = ev.pending ? `<span class="badge badge-pending">${s.badgePending}</span>` :
                  (ZENDESK_MAP[ev.nombreExcel] ? `<span class="badge badge-live">${s.badgeLive}</span>` : '');
    return `<tr class="tech-row" onclick="verFicha('${ev.nombreExcel.replace(/'/g, "\'")}')">
      <td class="tech-name-cell">${ev.nombreExcel}${badge}</td>
      <td class="right">${pillTotal(ev)}</td>
    </tr>`;
  }).join('');

  document.getElementById('app').innerHTML = `
    <div class="info-note">
      ${s.excludedNote}
    </div>
    <div class="card">
      <h2>${s.summaryCardTitle}</h2>
      <div class="chart-card"><canvas id="chartRanking"></canvas></div>
      <p class="info-note" id="avgRowCaption" style="margin-top:8px"></p>
      <p class="info-note" id="avgObjetivoRowCaption" style="margin-top:8px"></p>
    </div>
    <div class="card">
      <h2>${s.rankingCardTitle(periodLabel(currentPeriod))}</h2>
      <table>
        <thead><tr><th>${s.thTecnico}</th><th class="right">${s.thPctConseguido}</th></tr></thead>
        <tbody>${rows}</tbody>
      </table>
      <footer class="note">${s.resumenFooter}</footer>
    </div>
  `;

  const ctx = document.getElementById('chartRanking');
  if (typeof Chart === 'undefined') {
    ctx.closest('.chart-card').innerHTML = `<p style="color:var(--text-muted);font-size:12px;padding:1rem">${s.chartLoadError}</p>`;
    return;
  }
  if (chartRanking) chartRanking.destroy();
  const live = evals.filter(e => !e.pending);

  // Media del equipo: se muestra como una fila más en el gráfico (misma forma que la de cualquier
  // técnico, en rojo), en vez de una línea vertical — a petición explícita de Fernando (11 ago 2026).
  // Se calcula solo entre los técnicos con Resultado en al menos un indicador (totalPct !== null).
  const conDatoParaMedia = live.filter(e => e.totalPct !== null);
  const avgPct = conDatoParaMedia.length
    ? Math.round((conDatoParaMedia.reduce((sum, e) => sum + e.totalPct, 0) / conDatoParaMedia.length) * 100)
    : null;
  const avgCaptionEl = document.getElementById('avgRowCaption');
  if (avgCaptionEl) avgCaptionEl.textContent = avgPct === null ? '' : s.avgRowCaption(avgPct);

  // "Media Equipo Objetivo": misma idea, pero solo entre los 8 técnicos con objetivos completos
  // (Fernando, 15 sep 2026) — se pinta en verde y se coloca entre las demás barras según su valor.
  const conDatoParaMediaObjetivo = conDatoParaMedia.filter(e => TECNICOS_OBJETIVO_COMPLETO.has(e.nombreExcel));
  const avgObjetivoPct = conDatoParaMediaObjetivo.length
    ? Math.round((conDatoParaMediaObjetivo.reduce((sum, e) => sum + e.totalPct, 0) / conDatoParaMediaObjetivo.length) * 100)
    : null;
  const avgObjetivoCaptionEl = document.getElementById('avgObjetivoRowCaption');
  if (avgObjetivoCaptionEl) avgObjetivoCaptionEl.textContent = avgObjetivoPct === null ? '' : s.avgObjetivoRowCaption(avgObjetivoPct);

  const chartRows = live.map(e => ({ label: e.nombreExcel, value: e.totalPct === null ? 0 : Math.round(e.totalPct * 100), isAvg: false, isAvgObjetivo: false }));
  if (avgPct !== null) {
    chartRows.push({ label: s.avgRowLabel, value: avgPct, isAvg: true, isAvgObjetivo: false });
  }
  if (avgObjetivoPct !== null) {
    chartRows.push({ label: s.avgObjetivoRowLabel, value: avgObjetivoPct, isAvg: false, isAvgObjetivo: true });
  }
  if (avgPct !== null || avgObjetivoPct !== null) {
    chartRows.sort((a, b) => b.value - a.value);
  }

  chartRanking = new Chart(ctx, {
    type: 'bar',
    data: {
      labels: chartRows.map(r => r.label),
      datasets: [{ label: s.chartLabel, data: chartRows.map(r => r.value), backgroundColor: chartRows.map(r => r.isAvgObjetivo ? '#0ca30c' : r.isAvg ? '#c0392b' : '#2a78d6'), borderRadius: 4 }]
    },
    options: {
      indexAxis: 'y', responsive: true, maintainAspectRatio: false,
      // Espacio extra a la derecha para que el % pintado al final de cada barra (ver
      // BAR_VALUE_LABELS_PLUGIN) no se corte, sobre todo en las barras que llegan a valores altos.
      layout: { padding: { right: 40 } },
      plugins: { legend: { display: false } },
      scales: { x: { ticks: { callback: v => v + '%' } } }
    },
    plugins: [BAR_VALUE_LABELS_PLUGIN],
  });
}

function periodLabel(p) {
  return I18N[LANG].tabs[p] || p;
}

function fmtNum(n) {
  if (n === null || n === undefined) return '—';
  return (Math.round(n * 100) / 100).toLocaleString('es-ES');
}

function filaIndicador(f, opts) {
  opts = opts || {};
  const s = I18N[LANG];
  const origen = f.pending ? `<span class="badge badge-pending">${s.badgePendingBare}</span>` : f.manual ? `<span class="badge badge-excluded">${s.manualBadge}</span>` : `<span class="badge badge-live">${s.badgeLive}</span>`;
  const inverso = INVERSE_IDS.has(f.id) ? ` <span title="${s.inverseTooltip}" style="color:var(--text-muted);font-weight:700">${s.inverseTag}</span>` : '';
  const gatedBadge = f.gated ? ` <span class="badge" style="background:var(--critical-bg);color:var(--critical)" title="${s.gatedTitle}">${s.gatedBadge}</span>` : '';
  const pctTxt = f.pctCons === null ? '—' : `${Math.round(f.pctCons * 100)}%`;
  // "Calidad de los tickets cerrados" usa la misma regla de color que el artefacto "calidad-tickets-mp"
  // (indicación de Fernando, 10 ago 2026): verde desde el 90% de consecución, rojo si el resultado
  // bruto no llega al mínimo. El resto de indicadores mantiene la regla general (verde solo al 100%).
  const cls = f.id === 'calidad_de_los_tickets_cerrados'
    ? (f.pctCons === null ? 'pill-pending' : f.pctCons >= 0.9 ? 'pill-good' : (f.resultado !== null && f.resultado >= f.min) ? 'pill-warn' : 'pill-bad')
    : (f.pctCons === null ? 'pill-pending' : f.pctCons >= 1 ? 'pill-good' : f.pctCons >= 0.8 ? 'pill-warn' : 'pill-bad');
  let resultadoCell = fmtNum(f.resultado);
  if (f.esPuntos) {
    if (f.acum && f.acum.requiereBackend) {
      resultadoCell = `<span style="color:var(--warning)" title="${s.noDisponibleTitle}">${s.noDisponible}</span>`;
    } else if (f.acum && f.acum.exacto) {
      resultadoCell = `${fmtNum(f.resultado)}<div style="font-size:9.5px;color:var(--good);white-space:normal">${s.acumExacto}</div>`;
    } else {
      resultadoCell = `${fmtNum(f.resultado)}<div style="font-size:9.5px;color:var(--text-muted);white-space:normal">${s.acumAprox}</div>`;
    }
  } else if (f.esProrateado && f.resultado !== null && f.targetProrateado != null) {
    // EBITDA / Facturación Servicenter: el % Consec. ya compara contra el target prorrateado a los
    // meses cerrados (ver PRORRATEO_MENSUAL_IDS) — esta nota aclara contra qué cifra se ha comparado,
    // ya que la columna "Target" sigue mostrando el objetivo semestral completo.
    resultadoCell = `${fmtNum(f.resultado)}<div style="font-size:9.5px;color:var(--text-muted);white-space:normal">${s.prorateadoNote(fmtNum(f.targetProrateado), f.mesesCerrados)}</div>`;
  }

  // Indicadores individuales sin fuente en vivo, editables a mano desde la propia ficha (ver
  // MANUAL_TECNICO_EDITABLE_IDS) — mismo patrón que "Datos de empresa" pero por técnico.
  let manualEditBtn = '';
  const esEditable = opts.nombreExcel && MANUAL_TECNICO_EDITABLE_IDS.has(f.id);
  const estaEditando = esEditable && editandoManualTecnico
    && editandoManualTecnico.nombreExcel === opts.nombreExcel && editandoManualTecnico.indId === f.id;
  if (esEditable) {
    const nombreSafe = opts.nombreExcel.replace(/'/g, "\\'");
    if (estaEditando) {
      resultadoCell = `<input type="number" step="any" id="manualTecInput" value="${f.resultado ?? ''}" style="width:80px;text-align:right">
        <div style="margin-top:4px">
          <button onclick="guardarManualTecnico('${nombreSafe}','${f.id}')" style="font-size:10px;padding:2px 6px">${s.empresaSaveBtn}</button>
          <button onclick="cancelarEdicionManualTecnico()" style="font-size:10px;padding:2px 6px">${s.empresaCancelBtn}</button>
        </div>`;
    } else {
      manualEditBtn = ` <button onclick="abrirEdicionManualTecnico('${nombreSafe}','${f.id}')" title="${s.manualTecEditTitle}" style="border:none;background:none;cursor:pointer;font-size:12px;color:var(--text-muted);padding:0 2px">✎</button>`;
    }
  }

  let ritmoCell = '';
  if (opts.showRitmo) {
    const ritmoTxt = (f.pctRitmo === null || f.pctRitmo === undefined) ? '—' : `${Math.round(f.pctRitmo * 100)}%`;
    ritmoCell = `<td class="right">${ritmoTxt}</td>`;
  }
  return `<tr>
    <td>${trLabel(f.label)}${inverso}${gatedBadge} ${origen}${manualEditBtn}</td>
    <td class="right">${(f.peso*100).toFixed(0)}%</td>
    <td class="right">${fmtNum(f.min)}</td>
    <td class="right">${fmtNum(f.target)}</td>
    <td class="right">${fmtNum(f.max)}</td>
    <td class="right">${resultadoCell}</td>
    <td class="right"><span class="pill ${cls}">${pctTxt}</span></td>
    ${ritmoCell}
  </tr>`;
}

function verFicha(nombreExcel) {
  currentView = { type: 'ficha', nombreExcel };
  render();
}

function initials(n) { return n.split(' ').slice(0, 2).map(w => w[0]).join('').toUpperCase(); }

function renderFicha(nombreExcel) {
  const s = I18N[LANG];
  const ev = evaluarTecnico(nombreExcel);
  const area = ev.filas.filter(f => f.area === 'empresa');
  const individual = ev.filas.filter(f => f.area === 'individual');
  const zName = ZENDESK_MAP[nombreExcel];

  document.getElementById('app').innerHTML = `
    <button class="back-btn" onclick="volverResumen()">${s.backBtn}</button>
    <div class="card">
      <div class="tech-header">
        <div class="avatar">${initials(nombreExcel)}</div>
        <div>
          <div class="tech-title">${nombreExcel}</div>
          <div class="tech-sub">${zName ? s.zendeskLabel(zName) : s.noZendeskUser} · ${periodLabel(currentPeriod)}</div>
        </div>
        <div style="margin-left:auto">${pillTotal(ev)}</div>
      </div>

      ${ev.total === 0 ? `<div class="info-note">${s.noObjectivesNote}</div>` : ''}

      ${!ev.puntosGateOk ? `<div class="warn-note">${s.gateWarnNote(Math.round(UMBRAL_PUNTOS_MINIMO*100))}</div>` : ''}

      ${ev.total > 0 ? `
      <div class="section-h">${s.areaSection}</div>
      <table>
        <thead><tr><th>${s.thIndicador}</th><th class="right">${s.thPeso}</th><th class="right">${s.thMin}</th><th class="right">${s.thTarget}</th><th class="right">${s.thMax}</th><th class="right">${s.thResultado}</th><th class="right">${s.thPctConsec}</th></tr></thead>
        <tbody>${area.map(f => filaIndicador(f, { nombreExcel })).join('')}</tbody>
      </table>

      <div class="section-h">${s.individualSection}</div>
      <table>
        <thead><tr><th>${s.thIndicador}</th><th class="right">${s.thPeso}</th><th class="right">${s.thMin}</th><th class="right">${s.thTarget}</th><th class="right">${s.thMax}</th><th class="right">${s.thResultado}</th><th class="right">${s.thPctConsec}</th><th class="right">${s.thRitmo}</th></tr></thead>
        <tbody>${individual.map(f => filaIndicador(f, { showRitmo: true, nombreExcel })).join('')}</tbody>
      </table>${individual.some(f => MANUAL_TECNICO_EDITABLE_IDS.has(f.id)) ? `<p class="info-note" style="margin-top:10px">${s.manualTecNotConnectedNote}</p>` : ''}` : ''}
      <footer class="note">${s.fichaFooter}</footer>
    </div>
  `;
}

function volverResumen() { currentView = { type: 'resumen' }; render(); }

function abrirEdicionManualTecnico(nombreExcel, indId) {
  editandoManualTecnico = { nombreExcel, indId };
  render();
}
function cancelarEdicionManualTecnico() {
  editandoManualTecnico = null;
  render();
}
async function guardarManualTecnico(nombreExcel, indId) {
  const s = I18N[LANG];
  const input = document.getElementById('manualTecInput');
  const val = input && input.value !== '' ? parseFloat(input.value) : null;
  const valor = (val !== null && !isNaN(val)) ? val : null;

  if (manualWriteApiKey === null) {
    manualWriteApiKey = window.prompt(s.manualWriteApiKeyPrompt) || '';
  }

  try {
    const res = await fetch('/api/individual-data', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'x-api-key': manualWriteApiKey },
      body: JSON.stringify({ nombreExcel, indicador_id: indId, valor }),
    });
    if (!res.ok) {
      manualWriteApiKey = null; // clave incorrecta/vacía: se vuelve a pedir en el próximo intento
      alert(s.manualWriteSaveError);
      return;
    }
  } catch (e) {
    alert(s.manualWriteSaveError);
    return;
  }

  if (!MANUAL_TECNICO_DATOS[nombreExcel]) MANUAL_TECNICO_DATOS[nombreExcel] = {};
  MANUAL_TECNICO_DATOS[nombreExcel][indId] = valor;
  editandoManualTecnico = null;
  render();
}

function verEmpresa() { empresaEditMode = false; currentView = { type: 'empresa' }; render(); cargarEmpresaDatos(); }
function toggleEmpresaEdit(on) { empresaEditMode = on; render(); }

// Fernando, 17 sep 2026: los datos de empresa introducidos a mano desde esta pestaña deben persistir
// igual que los que trae n8n, no perderse al recargar. Reutiliza el mismo /api/company-data que ya
// usa n8n (mismo formato: indicador_id + mes YYYY-MM + valorMes + acumulado), protegido con la misma
// x-api-key que MANUAL_TECNICO_DATOS (ver manualWriteApiKey más arriba). Solo se envían al backend los
// indicadores a los que se les ha puesto un mes — los que se dejen sin mes no se tocan.
async function guardarEmpresaDatos() {
  const s = I18N[LANG];
  const aGuardar = [];
  for (const { id } of EMPRESA_INDICADORES) {
    const mesEl = document.getElementById(`empresa_mes_${id}`);
    const mesCerradoEl = document.getElementById(`empresa_mesCerrado_${id}`);
    const acumEl = document.getElementById(`empresa_acum_${id}`);
    const mes = mesEl && mesEl.value ? mesEl.value : null; // 'YYYY-MM' o null
    const mesCerrado = mesCerradoEl && mesCerradoEl.value !== '' ? parseFloat(mesCerradoEl.value) : null;
    const acumuladoSemestre = acumEl && acumEl.value !== '' ? parseFloat(acumEl.value) : null;
    if (!mes) continue; // sin mes seleccionado: este indicador no se guarda esta vez
    aGuardar.push({
      indicador_id: id,
      mes,
      valorMes: (mesCerrado !== null && !isNaN(mesCerrado)) ? mesCerrado : null,
      acumulado: (acumuladoSemestre !== null && !isNaN(acumuladoSemestre)) ? acumuladoSemestre : null,
    });
  }

  if (aGuardar.length === 0) {
    alert(s.empresaMesRequiredNote);
    return;
  }

  if (manualWriteApiKey === null) {
    manualWriteApiKey = window.prompt(s.manualWriteApiKeyPrompt) || '';
  }

  for (const item of aGuardar) {
    try {
      const res = await fetch('/api/company-data', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', 'x-api-key': manualWriteApiKey },
        body: JSON.stringify({ ...item, respondidoPor: 'Fernando (panel, edición manual)' }),
      });
      if (!res.ok) {
        manualWriteApiKey = null; // clave incorrecta/vacía: se vuelve a pedir en el próximo intento
        alert(s.manualWriteSaveError);
        return;
      }
    } catch (e) {
      alert(s.manualWriteSaveError);
      return;
    }
  }

  // Todo guardado en el backend: se recarga desde la fuente de verdad en vez de fiarse del estado
  // local, así el mesYYYYMM/ultimoMes quedan exactamente como los calcula el servidor.
  empresaLastSaved = new Date().toLocaleTimeString('es-ES');
  empresaEditMode = false;
  await cargarEmpresaDatos();
}

function renderEmpresa() {
  const s = I18N[LANG];
  const rows = EMPRESA_INDICADORES.map(({ id, label }) => {
    const d = EMPRESA_DATOS[id];
    if (empresaEditMode) {
      // Selector de mes (type=month, formato YYYY-MM nativo) en vez de texto libre — necesario para
      // poder guardar el dato en /api/company-data (mismo campo "mes" que usa n8n). Si el indicador
      // aún no tiene mesYYYYMM (p.ej. viejas ediciones con solo mesLabel), se deja vacío.
      return `<tr>
        <td>${trLabel(label)}</td>
        <td><input type="month" id="empresa_mes_${id}" value="${d.mesYYYYMM || ''}" style="width:130px"></td>
        <td class="right"><input type="number" step="any" id="empresa_mesCerrado_${id}" value="${d.mesCerrado ?? ''}" style="width:90px;text-align:right"></td>
        <td class="right"><input type="number" step="any" id="empresa_acum_${id}" value="${d.acumuladoSemestre ?? ''}" style="width:90px;text-align:right"></td>
      </tr>`;
    }
    const mesMostrado = formatMesYYYYMM(d.mesYYYYMM) || d.mesLabel || '—';
    return `<tr><td>${trLabel(label)}</td><td>${mesMostrado}</td><td class="right">${fmtNum(d.mesCerrado)}</td><td class="right">${fmtNum(d.acumuladoSemestre)}</td></tr>`;
  }).join('');
  document.getElementById('app').innerHTML = `
    <button class="back-btn" onclick="volverResumen()">${s.backBtn}</button>
    <div class="card">
      <h2>${s.empresaTitle}</h2>
      <p class="info-note">${s.empresaIntro}</p>
      <table>
        <thead><tr><th>${s.empresaThIndicador}</th><th>${s.empresaThMes}</th><th class="right">${s.empresaThValorMes}</th><th class="right">${s.empresaThAcum}</th></tr></thead>
        <tbody>${rows}</tbody>
      </table>
      <div style="margin-top:12px">
        ${empresaEditMode
          ? `<button onclick="guardarEmpresaDatos()">${s.empresaSaveBtn}</button> <button onclick="toggleEmpresaEdit(false)">${s.empresaCancelBtn}</button>`
          : `<button onclick="toggleEmpresaEdit(true)">${s.empresaEditBtn}</button>`}
        ${(!empresaEditMode && empresaLastSaved) ? `<span style="margin-left:10px;font-size:12px;color:var(--good)">${s.empresaSavedNote(empresaLastSaved)}</span>` : ''}
      </div>
      <p class="info-note" style="margin-top:14px">${s.empresaNotConnectedNote}</p>
    </div>
  `;
}

function render() {
  if (currentView.type === 'ficha') renderFicha(currentView.nombreExcel);
  else if (currentView.type === 'empresa') renderEmpresa();
  else renderResumen();
}

document.querySelectorAll('.tab-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    currentPeriod = btn.dataset.period;
    render();
  });
});

applyStaticI18N();
cargarDatos(false);
cargarEmpresaDatos();
cargarIndividualDatos();
</script>
</body>
</html>
